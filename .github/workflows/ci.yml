name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Install simulators
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends iverilog verilator ghdl
      - name: Versions
        run: iverilog -V | head -1; verilator --version; ghdl --version | head -1; cargo --version
      - name: Unit, mock-simulator, and CLI end-to-end tests
        run: cargo test --workspace --no-fail-fast
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Build CLI
        run: cargo build -p rivet-cli
      - name: dff example on Icarus
        run: target/debug/rivet run --sim icarus -C examples/dff
      - name: dff example on Verilator
        run: target/debug/rivet run --sim verilator -C examples/dff
      - name: VHDL dff example on GHDL
        run: target/debug/rivet run --sim ghdl -C examples/dff_vhdl
      - name: cargo test integration (dff on Icarus via RIVET_SIM)
        run: |
          cargo test -p example-dff -- --list
          cargo test -p example-dff
      - name: fifo example (kit) on Icarus and Verilator
        run: |
          target/debug/rivet run --sim icarus -C examples/fifo
          target/debug/rivet run --sim verilator -C examples/fifo
      - name: conformance suite on Icarus and Verilator
        run: |
          target/debug/rivet run --sim icarus -C examples/conformance
          target/debug/rivet run --sim verilator -C examples/conformance
      - name: bus example (kit, coverage, goldens, param sets, sharding) on Icarus and Verilator
        run: |
          target/debug/rivet run --sim icarus -C examples/bus -j 3 --cov-threshold 99
          target/debug/rivet run --sim verilator -C examples/bus
          target/debug/rivet cov report -C examples/bus --sim icarus --threshold 100
          cargo test -p example-bus -- --test-threads 2
      - name: Benchmarks (smoke)
        env:
          RIVET_BENCH_N: "2000"
        run: |
          target/debug/rivet run --sim icarus -C examples/bench
          target/debug/rivet run --sim verilator -C examples/bench

  python-integrations:
    # The Edalize/FuseSoC backend and the rivet_py shim for cocotb.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install simulators and Python packages
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends iverilog
          pip install maturin fusesoc edalize cocotb
          pip install -e integrations/edalize
      - name: Build CLI
        run: cargo build -p rivet-cli
      - name: FuseSoC runs the dff example through the rivet Edalize backend
        env:
          RIVET_BIN: ${{ github.workspace }}/target/debug/rivet
        run: |
          mkdir -p /tmp/fusesoc && cd /tmp/fusesoc
          fusesoc --cores-root ${{ github.workspace }}/examples/dff run --no-export --target sim --tool rivet rivet:examples:dff
      - name: rivet_py wheel, unit tests, and a cocotb test using it
        run: |
          cd python/rivet_py
          cargo clippy --release -- -D warnings
          maturin build --release -o dist
          pip install dist/*.whl
          cd tests && python -m unittest -v test_shim
          cd cocotb_dff && python run.py

  verilator-5036:
    # Verilator 5.036 is the oldest version cocotb 2.x supports and renamed
    # symbol-table accessors; the harness must work there too. Built from
    # source and cached by version.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache Verilator build
        id: cache-verilator
        uses: actions/cache@v4
        with:
          path: /opt/verilator-5.036
          key: verilator-5.036-ubuntu-24.04-v1
      - name: Build Verilator 5.036
        if: steps.cache-verilator.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends git help2man perl python3 make autoconf g++ flex bison ccache libfl2 libfl-dev zlib1g-dev
          git clone --depth 1 --branch v5.036 https://github.com/verilator/verilator.git /tmp/verilator
          cd /tmp/verilator && autoconf && ./configure --prefix=/opt/verilator-5.036 && make -j"$(nproc)" && sudo make install
      - name: Build CLI
        run: cargo build -p rivet-cli
      - name: Examples on Verilator 5.036
        env:
          VERILATOR: /opt/verilator-5.036/bin/verilator
        run: |
          export PATH=/opt/verilator-5.036/bin:$PATH
          verilator --version
          target/debug/rivet run --sim verilator -C examples/dff
          target/debug/rivet run --sim verilator -C examples/fifo
          target/debug/rivet run --sim verilator -C examples/conformance
