name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  binaries:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: macos-14
            target: aarch64-apple-darwin
          - os: macos-13
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build the CLI
        run: cargo build --release -p rivet-hdl-cli --target ${{ matrix.target }}
      - name: Package
        run: |
          set -eu
          dir="rivet-${{ github.ref_name }}-${{ matrix.target }}"
          mkdir -p "$dir"
          cp target/${{ matrix.target }}/release/rivet target/${{ matrix.target }}/release/cargo-rivet "$dir/"
          cp README.md CHANGELOG.md "$dir/"
          tar czf "$dir.tar.gz" "$dir"
          shasum -a 256 "$dir.tar.gz" > "$dir.tar.gz.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: rivet-${{ matrix.target }}
          path: |
            rivet-*.tar.gz
            rivet-*.tar.gz.sha256

  wheel:
    # The cocotb-side kit shim. One wheel: it is abi3 and links no
    # interpreter.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install maturin
      - name: Build the rivet_py wheel
        working-directory: python/rivet_py
        run: maturin build --release -o dist
      - uses: actions/upload-artifact@v4
        with:
          name: rivet-py-wheel
          path: python/rivet_py/dist/*.whl

  wheels-rivet-hdl:
    # `rivet-hdl`: the Python testbench API, and the binaries that make
    # `pip install rivet-hdl` enough on its own — the `rivet` CLI and the
    # PLI plugin. The plugin embeds CPython, so there is one wheel per
    # platform *and* per Python minor version. abi3 does not help: it
    # narrows the API, but pyo3 still links the concrete interpreter.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14, macos-13]
        python: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install maturin
      - name: Build the wheel, with the CLI and the plugin in it
        working-directory: python/rivet
        run: python3 build-wheel.py --out dist
      - name: It runs a testbench with nothing else installed
        # Proves the wheel is self-sufficient: no checkout on the path, no
        # cargo, no Rust. Only on Linux, where a simulator is cheap to get.
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends iverilog
          python3 -m venv /tmp/wheeltest
          /tmp/wheeltest/bin/pip install python/rivet/dist/*.whl
          mkdir -p /tmp/proj && cp python/rivet/examples/counter/* /tmp/proj/
          cd /tmp/proj && PATH=/tmp/wheeltest/bin:/usr/bin:/bin rivet run --sim icarus
      - uses: actions/upload-artifact@v4
        with:
          name: rivet-hdl-wheel-${{ matrix.os }}-py${{ matrix.python }}
          path: python/rivet/dist/*.whl

  publish-pypi:
    needs: [wheels-rivet-hdl, wheel]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    environment: pypi
    permissions:
      # Trusted publishing: no long-lived token in the repository.
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: rivet-hdl-wheel-*
          merge-multiple: true
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist

  publish-crates:
    needs: [binaries, wheel, wheels-rivet-hdl]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Publish in dependency order
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -eu
          # Dependency order. rivet-hdl-vhpi was missing from this list
          # before, so NVC users had no published backend.
          for c in rivet-hdl-core rivet-hdl-macros rivet-hdl-manifest rivet-hdl-kit \
                   rivet-hdl-vpi rivet-hdl-vhpi rivet-hdl-verilator rivet-hdl-mock \
                   rivet-hdl rivet-hdl-cli; do
            echo "::group::$c"
            cargo publish -p "$c" --no-verify
            # crates.io needs a moment before a dependant can resolve the new version
            sleep 30
            echo "::endgroup::"
          done

  release:
    needs: [binaries, wheel, wheels-rivet-hdl]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256
            dist/*.whl
          generate_release_notes: true
