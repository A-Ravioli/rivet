[build-system]
requires = ["maturin>=1.4,<2.0"]
build-backend = "maturin"

[project]
name = "rivet"
version = "0.1.0"
description = "Hardware testbenches in Python, on a native scheduler"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT OR Apache-2.0" }
keywords = ["hdl", "verilog", "vhdl", "verification", "cocotb", "simulation"]
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Electronic Design Automation (EDA)",
]

[project.urls]
Homepage = "https://github.com/A-Ravioli/rivet"
Documentation = "https://github.com/A-Ravioli/rivet/blob/main/docs/python.md"
Repository = "https://github.com/A-Ravioli/rivet"

[tool.maturin]
# The extension module, built as `rivet._rivet`. Inside a simulator this
# copy is not used: the PLI plugin puts an identical `_rivet` in the
# interpreter's inittab before anything can import it.
manifest-path = "crates/ext/Cargo.toml"
module-name = "rivet._rivet"
python-source = "src"
features = ["wheel"]
