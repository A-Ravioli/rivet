[package]
name = "rivet-py"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Python bindings to Rivet's simulator-independent kit (memory model, scoreboard, seeded random, functional coverage) for cocotb testbenches"
publish = false

# Not a member of the main workspace: it needs a Python interpreter and is
# built with maturin.
[workspace]

[lib]
name = "rivet_py"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.23", features = ["extension-module", "abi3-py38"] }
rivet-core = { package = "rivet-hdl-core", path = "../../crates/rivet-core" }
rivet-kit = { package = "rivet-hdl-kit", path = "../../crates/rivet-kit" }
