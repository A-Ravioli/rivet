[build-system]
requires = ["maturin>=1.4,<2.0"]
build-backend = "maturin"

[project]
name = "rivet-py"
version = "0.1.0"
description = "Rivet's kit (memory model, scoreboard, seeded random, functional coverage) for cocotb testbenches"
requires-python = ">=3.8"
classifiers = ["Programming Language :: Rust", "Programming Language :: Python :: 3"]

[tool.maturin]
features = ["pyo3/extension-module"]
module-name = "rivet_py"
