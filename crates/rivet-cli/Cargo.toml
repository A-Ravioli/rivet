[package]
name = "rivet-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Command-line runner for Rivet testbenches"

[lib]
name = "rivet_cli"
path = "src/lib.rs"

[[bin]]
name = "rivet"
path = "src/main.rs"

[dependencies]
rivet-manifest = { workspace = true }
serde_json = "1"
