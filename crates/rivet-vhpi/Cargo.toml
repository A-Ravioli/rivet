[package]
name = "rivet-vhpi"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "VHPI backend for Rivet (NVC, and the VHDL side of the commercial simulators)"
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
categories.workspace = true
keywords.workspace = true
readme = "README.md"

[dependencies]
rivet-core = { workspace = true }
log = { workspace = true }

[features]
default = ["startup-table"]
# The exported `vhpi_startup_routines` table the simulator scans. On by
# default; a library that embeds this backend but needs to run its own
# code at load time (the Python plugin) turns it off and exports its own,
# because the symbol can only be defined once in a shared object.
startup-table = []
