[package]
name = "rivet-hdl-kit"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Verification components for Rivet: drivers, monitors, scoreboards, bus models, checkers"
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
categories.workspace = true
keywords.workspace = true
readme = "README.md"

# The package is `rivet-hdl-kit` on crates.io; the library keeps its
# short name, so testbenches say `rivet_kit` as they always have.
[lib]
name = "rivet_kit"

[dependencies]
rivet-core = { workspace = true }
log = { workspace = true }
# Optional: a Python function as a reference model. Enabling this links
# libpython into the test library, so it is off by default.
pyo3 = { version = "0.23", features = ["auto-initialize"], optional = true }

[features]
python = ["dep:pyo3"]
