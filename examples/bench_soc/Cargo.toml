[package]
name = "example-bench-soc"
version.workspace = true
edition.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "bench_soc_verilator"
path = "src/main.rs"
required-features = ["verilator"]

[dependencies]
rivet = { workspace = true, features = ["vpi"] }
log = { workspace = true }

[build-dependencies]
rivet-verilator = { workspace = true }

[features]
verilator = ["rivet/verilator"]
